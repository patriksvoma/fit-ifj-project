name: CI

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  build-check:
    name: build-check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-14 clang-format cppcheck

    - name: Run tests and build
      run: make build-check
